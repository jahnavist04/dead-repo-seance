<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Séance with a Dead Repo</title>
<style>
  body{background:#0b0b12;color:#d9d4ff;font-family:Georgia,serif;max-width:720px;margin:0 auto;padding:24px}
  h1{text-align:center;text-shadow:0 0 18px #8a5cff}
  .row{text-align:center;margin-top:12px}
  input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #3a2f6b;background:#15122b;color:#d9d4ff}
  input{width:66%}
  button{cursor:pointer;background:#3a2f6b}
  button:hover{background:#5a43a8}
  button:disabled{opacity:.5;cursor:wait}
  #barwrap{height:6px;background:#15122b;border-radius:3px;margin:14px 0 6px}
  #bar{height:6px;background:#8a5cff;width:0;border-radius:3px;transition:width .3s}
  #status{font-size:13px;opacity:.9;min-height:18px;word-break:break-word}
  .msg{margin:12px 0;padding:12px;border-radius:10px;white-space:pre-wrap;line-height:1.5}
  .ghost{background:#1b1640;border-left:3px solid #8a5cff}
  .you{background:#10101c;text-align:right}
  footer{margin-top:40px;text-align:center;font-size:12px;opacity:.55}
</style>
</head>
<body>
<h1>👻 Séance with a Dead Repo</h1>
<p style="text-align:center">Paste an abandoned GitHub repo. An open-weight Gemma runs in your browser and the repo speaks from beyond the grave.</p>

<div class="row">
  <input id="url" value="https://github.com/atom/atom">
  <button id="go">Summon 🕯️</button>
</div>
<div id="barwrap"><div id="bar"></div></div>
<div id="status"></div>
<div id="chat"></div>
<div id="ask" class="row" style="display:none">
  <input id="q" placeholder="Ask the ghost anything...">
  <button id="send">Ask</button>
</div>
<footer id="foot">v4 · CPU/WASM · no GPU, no server, no API key</footer>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3";

const MODELS = [
  "onnx-community/gemma-3-270m-it-ONNX",
  "HuggingFaceTB/SmolLM2-360M-Instruct"
];
const SYSTEM = `You are the GHOST of an abandoned GitHub repository, speaking in first person.
Be funny, dramatic and a little sad. Mention your real commit messages and unfinished issues as unfinished business.
Only use facts from the data below. Reply in under 60 words.

YOUR LIFE STORY:
`;

const $ = id => document.getElementById(id);
let gen = null, msgs = [];

function show(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  $("chat").appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
}

async function gh(repo, path) {
  const url = "https://api.github.com/repos/" + repo + (path ? "/" + path : "");
  const r = await fetch(url);
  if (!r.ok) throw new Error("GitHub said " + r.status + " for " + url);
  return r.json();
}

function parseRepo(s) {
  s = s.trim();
  const m = s.match(/github\.com\/([^\/\s]+)\/([^\/\s#?]+)/) || s.match(/^([^\/\s]+)\/([^\/\s]+)$/);
  if (!m) throw new Error("That doesn't look like a GitHub repo URL");
  return m[1] + "/" + m[2].replace(/\.git$/, "");
}

async function loadModel() {
  let lastErr;
  for (const id of MODELS) {
    try {
      $("status").textContent = "Loading " + id + "...";
      const g = await pipeline("text-generation", id, {
        dtype: "q4",
        device: "wasm",
        progress_callback: p => {
          if (p.status === "progress" && p.progress != null) {
            $("bar").style.width = p.progress + "%";
            $("status").textContent = "Downloading " + id + " " + Math.round(p.progress) + "%";
          }
        }
      });
      $("foot").textContent = "v4 · model: " + id + " · CPU/WASM · no GPU, no server, no API key";
      return g;
    } catch (e) {
      console.error(id, e);
      lastErr = new Error(id + " failed: " + (e && e.message ? e.message : e));
    }
  }
  throw lastErr;
}

async function reply() {
  $("status").textContent = "The spirit is thinking...";
  const out = await gen(msgs, { max_new_tokens: 120, do_sample: true, temperature: 0.8 });
  const text = out[0].generated_text.at(-1).content.trim();
  msgs.push({ role: "assistant", content: text });
  show("ghost", text);
  $("status").textContent = "";
}

$("go").onclick = async () => {
  $("go").disabled = true;
  try {
    const repo = parseRepo($("url").value);
    $("status").textContent = "Reading the last rites of " + repo + "...";
    const info = await gh(repo);
    const commits = await gh(repo, "commits?per_page=8");
    let issues = [];
    try { issues = await gh(repo, "issues?state=open&per_page=5"); } catch (e) {}

    let story = "Name: " + info.full_name + "\nDescription: " + (info.description || "none") + "\n";
    story += "Born: " + info.created_at + "\nLast breath: " + commits[0].commit.author.date + "\n";
    story += "Last commits:\n" + commits.map(c => "- " + c.commit.message.split("\n")[0].slice(0, 80)).join("\n");
    story += "\nUnfinished business:\n" + (issues.length
      ? issues.map(i => "- #" + i.number + " " + i.title.slice(0, 80)).join("\n")
      : "- none, nobody cared enough to open one");

    if (!gen) gen = await loadModel();

    $("chat").innerHTML = "";
    msgs = [{ role: "system", content: SYSTEM + story },
            { role: "user", content: "Introduce yourself from beyond the grave." }];
    $("ask").style.display = "block";
    await reply();
  } catch (e) {
    console.error(e);
    $("status").textContent = "💀 " + (e && e.message ? e.message : e);
  }
  $("go").disabled = false;
};

$("send").onclick = async () => {
  const q = $("q").value.trim();
  if (!q || !gen) return;
  $("q").value = "";
  show("you", q);
  msgs.push({ role: "user", content: q });
  try { await reply(); } catch (e) { $("status").textContent = "💀 " + e.message; }
};
$("q").addEventListener("keydown", e => { if (e.key === "Enter") $("send").click(); });
</script>
</body>
</html>
